name: PRISM IDS CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx fastapi sqlalchemy pydantic structlog psutil jinja2
      - name: Run Server Unit Tests
        run: |
          pytest tests/

  test-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Agent dependencies
        run: |
          cd prism-agent
          python -m pip install --upgrade pip
          pip install pytest scapy httpx pydantic structlog psutil scikit-learn joblib
      - name: Run Agent Unit Tests
        run: |
          cd prism-agent
          pytest tests/

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Dashboard Frontend
        run: |
          cd prism-dashboard
          npm ci
          npm run build
