[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prism-ids-agent"
version = "1.0.0"
description = "Predictive Reasoning and Intelligent Security Monitoring - Lightweight IDS Agent Daemon"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "PRISM IDS Architecture Team" }
]
dependencies = [
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "psutil>=5.9.8",
    "structlog>=24.2.0",
    "scapy>=2.5.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
